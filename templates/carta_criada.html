<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <div class="carta {{ raridade }}">
        <img src="/static/images/{{ imagem }}" alt="{{ nome }}">
        <h2>{{ nome }}</h2>
        <p class="raridade">{{ raridade }}</p>
        <ul>
            <li>Viralidade: {{ viralidade }}</li>
            <li>Resenha: {{ resenha }}</li>
            <li>Aura: {{ aura }}</li>
        </ul>
        <p>Poder total: <b>{{ poder_total }}</b></p>
        <a class="botao" href="/duelo/{{ chave }}">Duelar com ela</a>
        <a href="/">Voltar para a coleção</a>
    </div>
</head>
